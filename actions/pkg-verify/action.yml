# SPDX-License-Identifier: LGPL-2.1-or-later
name: pkg-verify
description: >
  Install a whole LibreSCRS package stack in a clean container of the slug's
  image and judge it: shared libraries resolve, p11-kit lists exactly one
  LibreSCRS module for the variant, pkcs11-tool lists slots with no card,
  systemd units verify, D-Bus/polkit files sit on the daemons' paths, the
  direct<->agent switch behaves as documented for the package manager, and
  lintian/rpmlint findings are all accepted by lint-accepted/.

inputs:
  slug:
    description: Distribution slug from images.lock.
    required: true
  packages:
    description: Newline- or space-separated directories holding the stack's .deb/.rpm files.
    required: true
  report:
    description: Directory that keeps the raw logs; on failure they are printed to the job log and summarised in the run summary.
    required: false
    default: ''
  lint:
    description: >
      own = lint only the calling repository's packages: <dir>/<name> under each
      `packages` directory (the layout pkg-build leaves in its `art` output);
      the upstream packages are installed for the smoke checks and linted in
      their own repository. all = lint every package (the whole-stack run).
      Anything else is a directory list to lint.
    required: false
    default: own
  name:
    description: "Repository whose packages lint=own means (default: the repository part of github.repository)."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verify the ${{ inputs.slug }} stack
      shell: bash
      env:
        IN_SLUG: ${{ inputs.slug }}
        IN_PACKAGES: ${{ inputs.packages }}
        IN_REPORT: ${{ inputs.report }}
        IN_LINT: ${{ inputs.lint }}
        IN_NAME: ${{ inputs.name }}
        GH_REPOSITORY: ${{ github.repository }}
      run: |
        set -uo pipefail
        args=(--slug "$IN_SLUG")
        for d in $IN_PACKAGES; do args+=(--packages "$d"); done
        case "$IN_LINT" in
          all) ;;
          own)
            name="${IN_NAME:-${GH_REPOSITORY#*/}}"
            for d in $IN_PACKAGES; do
              [ ! -d "$d/$name" ] || args+=(--lint "$d/$name")
            done
            # pkg-verify.sh: a scope with no package cannot be judged; here
            # a missing <dir>/<name> is the same verdict, never "lint all".
            printf '%s\n' "${args[@]}" | grep -qx -- --lint \
              || { echo "::error::lint: own found no $name directory under: $IN_PACKAGES"; exit 2; }
            ;;
          *) for d in $IN_LINT; do args+=(--lint "$d"); done ;;
        esac
        report="${IN_REPORT:-$RUNNER_TEMP/pkg-verify-report-$IN_SLUG}"
        args+=(--report "$report")
        rc=0
        "$GITHUB_ACTION_PATH/../../scripts/pkg-verify.sh" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/pkg-verify-$IN_SLUG.out" || rc=${PIPESTATUS[0]}
        echo "PKG_VERIFY_RC=$rc"
        if [ "$rc" != 0 ]; then
          # Job log and run summary, not an artefact nothing downloads.
          for f in "$report"/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") (last 200 lines)"; tail -n 200 "$f"; echo "::endgroup::"
          done
          {
            echo "### pkg-verify on $IN_SLUG failed (rc=$rc)"
            echo '```'
            grep -E '^(FAIL|FINDING|ROW)|pkg-lint-accept:|== pkg-verify' "$RUNNER_TEMP/pkg-verify-$IN_SLUG.out" | tail -n 60
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
        fi
        exit "$rc"
