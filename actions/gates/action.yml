# SPDX-License-Identifier: LGPL-2.1-or-later
name: LibreSCRS gates
description: >-
  Run the shared gates this step names, against the consumer's checkout. An
  empty list or an unknown gate name is exit 2 -- never a silent pass.

# One call per place in the workflow, naming the gates that belong there:
#
#   - uses: LibreSCRS/ci/actions/gates@<sha>
#     with:
#       gates: check-workflows check-skip-reasons check-version deps-lock selftests
#
#   - uses: LibreSCRS/ci/actions/gates@<sha>        # after the build
#     with:
#       gates: deps-lock-build test-floor warning-gate
#       build-dir: build
#       build-log: build.log
#
# Known gates: check-skip-reasons, check-workflows, selftests, check-version,
# check-version-lockstep, deps-lock, deps-lock-build (build-dir), test-floor
# (build-dir, floor), warning-gate (build-dir, build-log, warning-leg).
#
# A composite step carries no timeout-minutes of its own: the calling job's
# bound is the bound. Needs python3 (PyYAML for check-workflows) and bash 4 or
# later for the shell gates (on macOS: brew install bash); a missing one is
# exit 2.

inputs:
  gates:
    description: Space-separated gate names to run, in order. Required.
    required: true
  root:
    description: >-
      Where the consumer is checked out, relative to the workspace. `.` (the
      default) for a job that checks it out at the workspace root.
    required: false
    default: '.'
  build-dir:
    description: >-
      The configured build tree, relative to the consumer root. Needed by
      deps-lock-build, test-floor and warning-gate; exported to the consumer's
      self-tests as BUILD_DIR.
    required: false
    default: ''
  build-log:
    description: The full build log warning-gate judges, relative to the consumer root.
    required: false
    default: ''
  warning-leg:
    description: >-
      The warning-baseline section's leg (<compiler>/<leg>), for a matrix that
      builds one compiler more than one way. Empty judges by the compiler alone.
    required: false
    default: ''
  floor:
    description: The test-floor file, relative to the consumer root. Default ci/test-floor.txt.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run the named gates
      shell: bash
      env:
        GATES_LIST: ${{ inputs.gates }}
        GATES_ROOT: ${{ inputs.root }}
        GATES_BUILD_DIR: ${{ inputs.build-dir }}
        GATES_BUILD_LOG: ${{ inputs.build-log }}
        GATES_WARNING_LEG: ${{ inputs.warning-leg }}
        GATES_FLOOR: ${{ inputs.floor }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/run-gates.py" \
          --gates "$GATES_LIST" \
          --root "$GATES_ROOT" \
          --build-dir "$GATES_BUILD_DIR" \
          --build-log "$GATES_BUILD_LOG" \
          --warning-leg "$GATES_WARNING_LEG" \
          --floor "$GATES_FLOOR"
