name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The tag-path fixtures read releases other people publish, and the package
  # repository's signatures expire; a week is how long either may go unseen.
  schedule:
    - cron: '41 3 * * 2'

permissions: {}

# The event is part of the group: a push must not cancel the weekly run (whose
# repo-watch would miss its week without a red run), nor the weekly run a
# push's hour-long container legs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  selftests:
    name: Self-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: GNU userland the gates assume (macOS ships bash 3.2 and bsdtar)
        if: runner.os == 'macOS'
        # gnupg, xz and zstd: release-train's self-test reads a signed package
        # repository with gpgv and its xz- and zstd-compressed indexes.
        run: |
          brew install bash gnu-tar gnupg xz zstd
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --break-system-packages pyyaml
      - name: Run every self-test
        run: ./scripts/run-selftests.sh

  dockertests:
    # The self-tests that run distribution containers, one leg per file: the
    # two probes take about an hour each and run side by side. They need the
    # network, because the packages they install inside the images come from
    # the distributions' mirrors. Each limit is the local wall time plus half.
    name: Container self-test (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        # Every scripts/*.dockertest.* needs a leg here; `run-selftests.sh
        # --kind docker` runs them all and lists the set.
        include:
          - test: pkg-sign.dockertest.sh
            minutes: 8
          - test: pkg-repo.dockertest.py
            minutes: 29
          - test: pkg-repo-probe.dockertest.sh
            minutes: 85
          - test: pkg-repo-probe-upgrade.dockertest.sh
            minutes: 125
          - test: aur-publish.dockertest.sh
            minutes: 15
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
        run: ./scripts/run-selftests.sh --kind docker --only "$TEST"

  repo-watch:
    # The live package repository between publishes: every InRelease must
    # verify and stay valid for more than 14 days, so a weekly re-sign that
    # stopped is red while apt still accepts the repository. It runs here
    # because this repository is active: GitHub disables a schedule after 60
    # days without activity, and the packages repository's own may stop
    # unseen.
    name: Package repository stays signed
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Watch the live InRelease
        env:
          EVENT: ${{ github.event_name }}
          # A 404 is judged by whether any code repository has released:
          # their public releases, read through gh.
          GH_TOKEN: ${{ github.token }}
        # Until the package key exists there is nothing to watch: the weekly
        # run stays green, and a run someone asked for cannot judge.
        run: |
          if [ ! -f keys/package-signing.env ]; then
            echo "no package key yet"
            [ "$EVENT" = schedule ] && exit 0
            exit 2
          fi
          python3 scripts/pkg-repo.py watch --url https://librescrs.github.io/packages \
            --keyset package-signing --min-days 14

  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: shellcheck 0.11.0 (pinned, so CI and a local run judge alike)
        run: |
          curl -fsSL -o sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.tar.xz" | sha256sum -c -
          tar xJf sc.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          sudo install -m755 shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        # Every tracked file whose first line names bash, whatever its extension.
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            head -n1 -- "$f" | grep -q '^#!.*bash' && printf '%s\0' "$f"
          done | xargs -0 -r shellcheck -x

  tag-path-fixtures:
    # The verifiers a tag runs, proved both ways against releases that exist:
    # verify-release-tag accepts the published LibreMiddleware 4.2.0 tag and
    # rejects forgeries; the keyless cosign identity and the attestation check
    # accept real bundles and reject another repository, ref or workflow. One
    # run here, on every change to these scripts and weekly, instead of one per
    # consumer rehearsal.
    name: Tag-path verifiers on published fixtures
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The release public key, from the repository that publishes it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/LibreMiddleware
          path: _keys
          sparse-checkout: KEYS
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: verify-release-tag accepts 4.2.0 and rejects forgeries
        env:
          REPO_ROOT: ${{ github.workspace }}/_keys
        run: ./scripts/verify-release-tag.sh rehearse
      - name: Keyless verification, both ways, on published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-seal.sh fixture-keyless
      - name: Attestation verification, both ways, on a public attested artefact
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-seal.sh fixture-attest
