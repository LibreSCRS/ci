# images.lock -- what the packaging builds run in and with. Read by
# scripts/pkg-images; refreshed ONLY by `scripts/pkg-images refresh`, never by
# hand, and held by `scripts/pkg-images check`.
#
# Two row kinds:
#
#   image <slug> <manager> <repository>:<tag>@sha256:<digest>
#       One container image per distribution slug. The slug is the suffix every
#       published package carries (`<package>.<slug>.<deb|rpm>`); the manager is
#       apt | dnf | zypper and decides the family (apt -> deb, else rpm). The tag
#       is kept only so `refresh` knows what to re-resolve: docker pulls by the
#       digest and ignores the tag once both are given.
#
#   tool <name> <version> <url> <sha256>
#       A binary the AppImage build downloads. The URL names a RELEASE VERSION,
#       never `continuous`: bytes behind a moving URL change under a fixed sum,
#       and the checksum then fails on a day nobody changed anything.
#       appimage-runtime is passed to appimagetool with --runtime-file; without
#       it appimagetool fetches the runtime from a `continuous` URL itself.
#
# Measured 2026-09-26 against registry-1.docker.io (image index digests) and
# the downloaded release assets (sha256 of the bytes).

